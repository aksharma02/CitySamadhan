{% extends "base.html" %}

{% block title %}Sign In - City Samadhan{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 160px);">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <div class="x-logo-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 24px;">
                <i class="fa-solid fa-landmark-dome"></i>
            </div>
            <h3 class="fw-bold mb-1">Sign in to CitySamadhan</h3>
            <p class="text-muted small">Report local issues & hold civic bodies accountable</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">EMAIL ADDRESS</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                    <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" placeholder="citizen@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label small fw-semibold text-secondary">PASSWORD</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-bold mt-2 shadow-sm">
                Sign In
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
