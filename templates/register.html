{% extends "base.html" %}

{% block title %}Join City Samadhan - Civic Grievance Network{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-4" style="min-height: calc(100vh - 160px);">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white" style="max-width: 520px; width: 100%;">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="City Samadhan Logo" class="x-auth-logo-img mb-3">
            <h3 class="fw-bold mb-1">Create Citizen Account</h3>
            <p class="text-muted small">Join your neighbors in resolving civic issues across your city</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="name" class="form-label small fw-semibold text-secondary">FULL NAME</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Aakash Sharma" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label small fw-semibold text-secondary">EMAIL</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="citizen@email.com" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label small fw-semibold text-secondary">PHONE (10 DIGITS)</label>
                    <input type="tel" id="phone" name="phone" class="form-control" pattern="[0-9]{10}" placeholder="9876543210" required>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label for="regState" class="form-label small fw-semibold text-secondary">STATE</label>
                    <select id="regState" name="state" class="form-select" required onchange="handleRegStateChange()">
                        <option value="">Select State</option>
                        {% for s in states %}
                        <option value="{{ s }}">{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="regCity" class="form-label small fw-semibold text-secondary">CITY</label>
                    <select id="regCity" name="city" class="form-select" required>
                        <option value="">Select City</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label for="password" class="form-label small fw-semibold text-secondary">PASSWORD</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="col-md-6">
                    <label for="confirm_password" class="form-label small fw-semibold text-secondary">CONFIRM</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-bold shadow-sm">
                Complete Registration
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function handleRegStateChange() {
    const s = document.getElementById('regState').value;
    const c = document.getElementById('regCity');
    if (!s) return;
    c.innerHTML = '<option value="">Loading...</option>';
    fetch(`/get_cities/${encodeURIComponent(s)}`)
        .then(res => res.json())
        .then(cities => {
            c.innerHTML = '<option value="">Select City</option>';
            cities.forEach(city => {
                const opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                c.appendChild(opt);
            });
        });
}
</script>
{% endblock %}
